[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "homebuild-log-backend"
version = "0.1.0"
description = "HomeBuild Log 本地 API 服务"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi[standard]==0.128.0",
    "httpx>=0.28.1,<1",
    "PyJWT>=2.8,<3",
    "sqlalchemy>=2.0,<2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--basetemp=tests/.tmp", "-p", "no:cacheprovider"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
