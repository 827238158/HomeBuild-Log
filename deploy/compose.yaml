name: homebuild-log

services:
  app:
    image: ${HOMEBUILD_IMAGE:-homebuild-log:4a-20260715}
    pull_policy: never
    init: true
    restart: unless-stopped
    ports:
      - "${HOMEBUILD_BIND_ADDRESS:-127.0.0.1}:${HOMEBUILD_PORT:-8000}:8000"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MIMO_API_KEY: ${MIMO_API_KEY:-}
    volumes:
      - ./.local-data:/app/.local-data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    stop_grace_period: 30s

  caddy:
    profiles:
      - https
    image: ${HOMEBUILD_CADDY_IMAGE:-caddy:2.11.4-alpine}
    pull_policy: never
    init: true
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HOMEBUILD_HTTPS_BIND_ADDRESS:-127.0.0.1}:${HOMEBUILD_HTTPS_PORT:-443}:443"
    environment:
      HOMEBUILD_HTTPS_HOST: ${HOMEBUILD_HTTPS_HOST:-127.0.0.1}
      HOMEBUILD_LAN_CIDR: ${HOMEBUILD_LAN_CIDR:-127.0.0.1/32}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # /data 包含本地 CA 私钥，必须持久化且不可提交 Git。
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
