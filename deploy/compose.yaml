name: homebuild-log

services:
  app:
    image: ${HOMEBUILD_IMAGE:-homebuild-log:4a-20260715}
    pull_policy: never
    init: true
    restart: unless-stopped
    ports:
      - "${HOMEBUILD_BIND_ADDRESS:-127.0.0.1}:${HOMEBUILD_PORT:-8000}:8000"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MIMO_API_KEY: ${MIMO_API_KEY:-}
    volumes:
      - ./.local-data:/app/.local-data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    stop_grace_period: 30s
